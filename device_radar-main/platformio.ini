; DeviceRadar — M5Stack Core2 (Mantis edition)
; Official Core2 PlatformIO pattern from docs.m5stack.com

[platformio]
default_envs = m5stack-core2

; Default build. espressif32 6.x installs the prebuilt Arduino-ESP32 2.0.x core,
; whose esp32 sdkconfig ships CONFIG_ESP32_WIFI_CSI_ENABLED=y, so SENSE gets CSI
; with no extra steps. Pinned to >= 6.5 so an old cached platform (pre-2.0.3
; cores had CSI off) is never picked up.
[env:m5stack-core2]
platform = espressif32@^6.5.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM

; Optional: Arduino-ESP32 3.x (IDF 5.x) via pioarduino. custom_sdkconfig forces
; CSI on by rebuilding the core libraries once ("hybrid compile", slow first
; build). Use only if you want the 3.x core:  pio run -e m5stack-core2-idf5
[env:m5stack-core2-idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
custom_sdkconfig =
    CONFIG_ESP_WIFI_CSI_ENABLED=y
