name: drop_zip

# ONE-FILE BOOTSTRAP + DELTA UPDATER
#
# Nuke your repo down to almost nothing, keep just THIS file at
# .github/workflows/drop_zip.yml, then commit a project zip to the repo ROOT
# (e.g. DeviceRadar.zip). This workflow:
#   1. finds the newest *.zip in the repo root,
#   2. unzips it INCLUDING dotfiles/dotfolders,
#   3. if the zip wraps everything in a single top folder, flattens it,
#   4. overlays onto the repo (add + replace; nothing deleted),
#   5. commits the result and deletes the consumed zip.
#
# Zips must NOT contain .github/workflows (the token can't write workflow
# files); ship those as github/workflows and move them into .github/workflows
# yourself after the first expand.

on:
  push:
    paths: [ "*.zip" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find newest root zip
        id: find
        run: |
          zip=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -z "$zip" ]; then echo "have=0" >> $GITHUB_OUTPUT;
          else echo "have=1" >> $GITHUB_OUTPUT; echo "zip=$zip" >> $GITHUB_OUTPUT; echo "Found $zip"; fi

      - name: Expand and overlay
        if: steps.find.outputs.have == '1'
        run: |
          set -e
          zip="${{ steps.find.outputs.zip }}"
          tmp=$(mktemp -d)
          unzip -oq "$zip" -d "$tmp"
          entries=$(ls -A "$tmp")
          if [ "$(echo "$entries" | wc -l)" -eq 1 ] && [ -d "$tmp/$entries" ]; then
            src="$tmp/$entries"
          else
            src="$tmp"
          fi
          cp -a "$src"/. ./ 2>/dev/null || (cd "$src" && tar cf - . | (cd "$OLDPWD" && tar xf -))
          rm -rf "$tmp"
          rm -f "$zip"

      - name: Commit
        if: steps.find.outputs.have == '1'
        run: |
          git config user.name  "deviceradar-drop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "drop_zip: expand ${{ steps.find.outputs.zip }}"
            git push
          fi
